# Deploy to EC2 on every push to main (same steps as update.sh, run over SSH).
# Required repo secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running build instead of
# racing it on the 4 GiB instance.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pull and redeploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -e
            cd ~/halo-insight
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            echo "Deploying $(git rev-parse --short HEAD)"
            ./deploy.sh production

            # Fail the run if the new container doesn't come up healthy.
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:5000/health >/dev/null; then
                echo "Health check passed"
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed; recent logs:"
            docker logs --tail 50 gladly-prod
            exit 1
